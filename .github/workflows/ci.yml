# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registers:
    name: Register and editorial gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run the editorial gate
        run: node .github/scripts/check-registers.mjs

  types:
    name: Types compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The package is typescript; the binary is tsc. `npx typescript@5` fails
      # with "could not determine executable to run".
      - name: Type check the envelope
        run: npx --yes --package typescript@5 tsc --noEmit --strict --skipLibCheck schema/v1/envelope.ts

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nothing published may cite a document nobody can open. A repository
      # that footnotes an invisible document is worse than one that footnotes
      # nothing.
      - name: No cross-references to unpublished working documents
        run: |
          hits=$(git ls-files -z '*.md' '*.json' '*.ts' '*.html' \
            | xargs -0 -r grep -lF "$(printf '\xc2\xa7')" || true)
          if [ -n "$hits" ]; then
            echo "Published files contain the section-mark character, which can"
            echo "only be a reference to an unpublished working document:"
            echo "$hits"
            exit 1
          fi
          echo "No references to unpublished documents."

      - name: No private working document is tracked
        run: |
          hits=$(git ls-files | grep -iE 'brief|next-steps|handover' || true)
          if [ -n "$hits" ]; then
            echo "Private working documents are tracked in this repository:"
            echo "$hits"
            exit 1
          fi
          echo "No private working documents tracked."

      # The framing is structural, not aspirational. A published file that
      # drops it does not merge.
      - name: The framing statement is present
        run: |
          fail=0
          full='This is a suggestion, not a standard.'
          short='not a standard, and endorsed by nobody'

          for f in README.md index.html schema/README.md commons/README.md \
                   CONTRIBUTING.md VERSIONING.md; do
            if ! grep -qF "$full" "$f"; then
              echo "MISSING full framing statement: $f"
              fail=1
            fi
          done

          for f in NOTICE SECURITY.md schema/v1/envelope.ts; do
            if ! grep -qF "$short" "$f"; then
              echo "MISSING short framing statement: $f"
              fail=1
            fi
          done

          node -e '
            const r = JSON.parse(require("fs").readFileSync("schema/v1/components.json","utf8"));
            if (typeof r.disclaimer !== "string" || r.disclaimer.length === 0) {
              console.error("MISSING disclaimer: schema/v1/components.json");
              process.exit(1);
            }
          ' || fail=1

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "The framing statement must appear in every published file."
            echo "This project is a suggestion, and a reader must be told so"
            echo "wherever they enter the repository."
            exit 1
          fi
          echo "Framing statement present in every published file."

      - name: The root licence is detectable
        run: |
          # A scope header prepended to /LICENSE makes GitHub report the
          # repository licence as NOASSERTION. It must stay verbatim.
          head -3 LICENSE | grep -q 'Apache License' \
            || { echo "/LICENSE does not start with the Apache License text."; exit 1; }
          echo "Root LICENSE begins with the verbatim Apache License text."
